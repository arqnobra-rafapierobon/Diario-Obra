<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="app"><div class="empty">Carregando…</div></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
/* ---------- armazenamento no aparelho (IndexedDB) ---------- */
const STORES=['obras','rdos','locacoes','projetos','arquivos','config'];
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{
    if(!('indexedDB' in window))return rej(new Error('sem IndexedDB'));
    const r=indexedDB.open('diario-obra',2);
    r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error);
  })},
  tx(n,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(n,mode);const q=fn(t.objectStore(n));let out;if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(n){return this.tx(n,'readonly',s=>s.getAll())},
  get(n,id){return this.tx(n,'readonly',s=>s.get(id))},
  put(n,v){return this.tx(n,'readwrite',s=>s.put(v))},
  del(n,id){return this.tx(n,'readwrite',s=>s.delete(id))},
};
let pediuPersist=false;
function persistir(){if(pediuPersist)return;pediuPersist=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}

const S={cfg:{id:'empresa'},obras:[],allRdos:[],allLocs:[],allProjs:[],view:{name:'home'},obra:null,rdos:[],locs:[],projs:[],draft:null,loc:null,proj:null,busy:false,ready:false,erro:null};
const urls={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmt=iso=>iso?iso.split('-').reverse().join('/'):'—';
const DS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dia=iso=>new Date(iso+'T12:00:00');
const diff=(a,b)=>Math.round((dia(b)-dia(a))/86400000);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const STATUS={andamento:['Em andamento','ok'],paralisada:['Paralisada','warn'],concluida:['Concluída','']};
const TEMPO=['Bom','Nublado','Chuva','Sem expediente'];
const COND=['Praticável','Impraticável'];
const FUNCOES=['Mestre de obras','Pedreiro','Servente','Carpinteiro','Armador','Eletricista','Encanador','Pintor'];
const DISC=['Arquitetônico','Estrutural','Fundações','Elétrico','Hidrossanitário','Incêndio','Outros'];
const maskCnpj=v=>{v=String(v||'').replace(/\D/g,'').slice(0,14);return v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')};
function cnpjOk(c){c=String(c||'').replace(/\D/g,'');if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+c[12]&&calc(13)===+c[13]}
function empBloco(cls){const c=S.cfg||{};return `<div class="emp ${cls||''}"><div class="logo ${c.logo?'':'vazio'}">${c.logo?`<img src="${esc(c.logo)}" alt="Logo ${esc(c.razaoSocial||'')}">`:'LOGO'}</div><div style="min-width:0"><div class="nm">${esc(c.razaoSocial||'Empresa não cadastrada')}</div>${c.cnpj?`<div class="doc">CNPJ ${esc(c.cnpj)}</div>`:''}</div></div>`}
const CIRC=`<svg class="circ" viewBox="0 0 1180 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="var(--circuit)" stroke-width="3">
<path d="M160 0V30H345V370H435V560"/><path d="M0 30H160"/><path d="M345 155H1020V28"/><path d="M620 155V280H898V560"/><path d="M160 370H345"/><path d="M898 402H1180"/>
<g fill="var(--circuit)" stroke="none"><circle cx="345" cy="155" r="10"/><circle cx="620" cy="155" r="10"/><circle cx="898" cy="280" r="10"/><circle cx="435" cy="370" r="10"/></g>
<rect x="30" y="233" width="80" height="105" rx="5"/><circle cx="70" cy="285" r="22"/><path d="M48 285H92M70 263V307"/>
<rect x="760" y="402" width="103" height="105" rx="5"/><circle cx="811" cy="455" r="30"/><circle cx="811" cy="455" r="12"/>
<circle cx="1020" cy="6" r="22"/><circle cx="1020" cy="6" r="9"/></svg>`;
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2800)}
function confirmar(msg,btn,fn){S.confirm={msg,btn,fn};renderModal()}
function renderModal(){
  const m=$('#modal');
  if(!S.confirm){m.innerHTML='';return}
  m.innerHTML=`<div class="modal"><div class="card" role="dialog" aria-modal="true"><p style="margin:0">${esc(S.confirm.msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="cf-no">Cancelar</button><button class="btn primary" data-act="cf-yes">${esc(S.confirm.btn)}</button></div></div></div>`;
}
function locStatus(l){
  if(l.devolvido) return {k:'',txt:'Devolvido'};
  if(!l.vencimento) return {k:'',txt:'Sem vencimento'};
  const d=diff(hoje(),l.vencimento);
  if(d<0) return {k:'crit',txt:`Vencida há ${-d} dia${d===-1?'':'s'}`};
  if(d===0) return {k:'crit',txt:'Vence hoje'};
  if(d<=3) return {k:'warn',txt:`Vence em ${d} dia${d===1?'':'s'}`};
  return {k:'ok',txt:`Vence em ${fmt(l.vencimento)}`};
}
function alertas(obraId){let c=0,w=0;S.allLocs.forEach(l=>{if(l.obraId!==obraId)return;const s=locStatus(l);if(s.k==='crit')c++;else if(s.k==='warn')w++});return {c,w}}

/* ---------- imagens / arquivos ---------- */
async function urlDe(id){
  if(urls[id])return urls[id];
  const a=await DB.get('arquivos',id);if(!a)return null;
  urls[id]=URL.createObjectURL(a.blob);return urls[id];
}
function hidratar(){document.querySelectorAll('img[data-img]').forEach(async img=>{if(img.src)return;const u=await urlDe(img.dataset.img);if(u)img.src=u;else img.alt='Foto não encontrada'})}
function soltarUrl(id){if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}}
async function apagarArquivo(id){soltarUrl(id);try{await DB.del('arquivos',id)}catch(e){}}

/* ---------- dados derivados ---------- */
function derivar(){
  if(!S.obra)return;const id=S.obra.id;
  S.obra=S.obras.find(o=>o.id===id)||S.obra;
  S.rdos=S.allRdos.filter(r=>r.obraId===id).sort((a,b)=>b.data.localeCompare(a.data));
  S.locs=S.allLocs.filter(l=>l.obraId===id);
  S.projs=S.allProjs.filter(p=>p.obraId===id);
}
function troca(arr,rec){const i=arr.findIndex(x=>x.id===rec.id);if(i>=0)arr[i]=rec;else arr.push(rec)}
function tira(arr,id){const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1)}
function abrirObra(id,tab){
  S.obra=S.obras.find(o=>o.id===id)||null;if(!S.obra){S.view={name:'home'};render();return}
  S.view={name:'obra',id,tab:tab||'diario'};S.loc=null;S.proj=null;
  LS.set('ultimaObra',id);render();
}

/* ---------- topo ---------- */
function renderTop(){
  const v=S.view;let back='',title='Diário de Obra',sub=S.cfg?.razaoSocial||'';
  if(v.name==='obra'){back='home';title=S.obra?.nome||'Obra';sub=S.obra?.endereco||''}
  if(v.name==='obraForm'){back=v.id?'obra':'home';title=v.id?'Editar obra':'Nova obra'}
  if(v.name==='rdo'||v.name==='rdoEdit'){back='obra';title=v.name==='rdo'?'Relatório diário':'Preencher RDO';sub=S.obra?.nome||''}
  if(v.name==='backup'){back='home';title='Backup e dados'}
  if(v.name==='empresa'){back='home';title='Empresa e responsáveis'}
  $('#top').innerHTML=`${back?`<button class="back" data-act="back" data-to="${back}" aria-label="Voltar">‹ Voltar</button>`:''}<div class="brand">${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</div>${v.name==='home'?`<button class="back" data-act="empresa">Empresa</button><button class="back" data-act="backup">Backup</button>`:''}`;
}

function vHome(){
  const ordem={andamento:0,paralisada:1,concluida:2};
  const obras=[...S.obras].sort((a,b)=>(ordem[a.status]??0)-(ordem[b.status]??0)||(b.ultimoRdo||'').localeCompare(a.ultimoRdo||''));
  const d=new Date();
  const c=S.cfg||{};
  let h=`<section class="hero">${CIRC}<div class="t1">DIÁRIO</div><div class="rule"></div><div class="t2">DE OBRA</div><span class="date">${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}</span><span class="code">ENG-RDO-${String(S.allRdos.length).padStart(3,'0')}</span></section>`;
  h+=c.razaoSocial?`<button class="card item" data-act="empresa" style="align-items:center">${empBloco()}<span class="grow"></span><span class="muted" aria-hidden="true">›</span></button>`
    :`<div class="card row spread"><div><div class="eyebrow">Configuração</div><div style="font-weight:600">Cadastre sua empresa: logo, razão social e CNPJ saem em todos os relatórios.</div></div><button class="btn" data-act="empresa">Cadastrar empresa</button></div>`;
  h+=`<div class="row spread"><div><div class="eyebrow">${DS[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]}</div><h1>Minhas obras</h1></div><button class="btn primary" data-act="novaObra">+ Nova obra</button></div>`;
  if(!obras.length) h+=`<div class="empty">Nenhuma obra cadastrada ainda.<br>Toque em <b>+ Nova obra</b> para começar o diário.<br><br><span style="font-size:14px">Os dados ficam guardados neste aparelho. Faça backup de vez em quando em <b>Backup</b>.</span></div>`;
  h+=`<div class="list">`+obras.map(o=>{
    const st=STATUS[o.status]||STATUS.andamento;const a=alertas(o.id);
    const dias=o.inicio?diff(o.inicio,hoje())+1:null;
    const rdoHoje=o.ultimoRdo===hoje();
    return `<button class="item" data-act="abrir" data-id="${esc(o.id)}"><span class="stripe ${a.c?'crit':a.w?'warn':''}"></span><span class="grow">
      <span class="t">${esc(o.nome)}</span>
      <span class="s" style="display:block">${esc(o.endereco||o.cliente||'')}</span>
      <span class="row" style="gap:6px;margin-top:6px"><span class="pill ${st[1]}">${st[0]}</span>
      ${dias!==null&&dias>0?`<span class="pill mono">Dia ${dias}</span>`:''}
      ${rdoHoje?'<span class="pill ok">RDO de hoje feito</span>':o.status!=='concluida'?`<span class="pill">Último RDO: ${o.ultimoRdo?fmt(o.ultimoRdo):'nenhum'}</span>`:''}
      ${a.c?`<span class="pill crit">${a.c} locação vencida</span>`:''}${a.w?`<span class="pill warn">${a.w} vencendo</span>`:''}</span>
    </span><span class="muted" aria-hidden="true">›</span></button>`}).join('')+`</div>`;
  return h;
}

function vObra(){
  const o=S.obra||{};const t=S.view.tab;
  const tabs=[['diario','Diário'],['locacoes','Locações'],['projetos','Projetos'],['dados','Dados']];
  let h=`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${t===k}" data-act="tab" data-tab="${k}">${l}${k==='locacoes'&&S.locs.length?` <span class="mono">(${S.locs.filter(x=>!x.devolvido).length})</span>`:''}</button>`).join('')}</div>`;
  if(t==='diario')h+=tDiario(o);
  if(t==='locacoes')h+=tLocacoes();
  if(t==='projetos')h+=tProjetos();
  if(t==='dados')h+=tDados(o);
  return h;
}

function tDiario(o){
  const hj=hoje();const feito=S.rdos.find(r=>r.data===hj);
  const venc=S.locs.map(l=>({l,s:locStatus(l)})).filter(x=>x.s.k==='crit'||x.s.k==='warn');
  let h='';
  if(venc.length)h+=`<button class="alert ${venc.some(x=>x.s.k==='crit')?'crit':'warn'}" style="border:0;text-align:left;cursor:pointer" data-act="tab" data-tab="locacoes">⚠ ${venc.map(x=>`${esc(x.l.equipamento)} — ${x.s.txt.toLowerCase()}`).join(' · ')}</button>`;
  h+=`<div class="card row spread"><div><div class="muted" style="font-size:13px">HOJE · ${fmt(hj)}${o.inicio?` · <span class="mono">DIA ${diff(o.inicio,hj)+1}</span>`:''}</div><div style="font-weight:600">${feito?'RDO de hoje já iniciado':'RDO de hoje ainda não preenchido'}</div></div>
  <button class="btn primary" data-act="rdoNovo">${feito?'Continuar RDO':'Preencher RDO de hoje'}</button></div>`;
  h+=`<div class="row spread"><h2>Histórico</h2><span class="muted mono">${S.rdos.length} relatório${S.rdos.length===1?'':'s'}</span></div>`;
  if(!S.rdos.length) h+=`<div class="empty">Os relatórios diários desta obra vão aparecer aqui, do mais recente ao mais antigo.</div>`;
  h+=`<div class="list">`+S.rdos.map(r=>{
    const d=dia(r.data);const ef=(r.efetivo||[]).reduce((s,e)=>s+(+e.qtd||0),0);
    const cl=r.clima||{};const imp=['manha','tarde','noite'].some(p=>cl[p]?.cond==='Impraticável');
    return `<button class="item" data-act="rdoVer" data-id="${esc(r.id)}"><span class="datebox"><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></span><span class="grow">
      <span class="t" style="font-size:16px">${DS[d.getDay()]}${o.inicio?` · <span class="mono muted" style="font-size:14px">Dia ${diff(o.inicio,r.data)+1}</span>`:''}</span>
      <span class="s" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((r.servicos||'Sem serviços registrados').split('\n')[0])}</span>
      <span class="row" style="gap:6px;margin-top:6px"><span class="pill">Manhã: ${esc(cl.manha?.tempo||'—')}</span><span class="pill">Tarde: ${esc(cl.tarde?.tempo||'—')}</span><span class="pill">Noite: ${esc(cl.noite?.tempo||'—')}</span>
      ${imp?'<span class="pill warn">Impraticável</span>':''}<span class="pill mono">${ef} pessoas</span>${(r.fotos||[]).length?`<span class="pill mono">${r.fotos.length} foto${r.fotos.length>1?'s':''}</span>`:''}</span>
    </span></button>`}).join('')+`</div>`;
  return h;
}

/* ---------- RDO ---------- */
function novoDraft(data){
  const base=S.rdos.find(r=>r.data===data);
  const vazio={manha:{tempo:'Bom',cond:'Praticável'},tarde:{tempo:'Bom',cond:'Praticável'},noite:{tempo:'Sem expediente',cond:''}};
  if(base)return JSON.parse(JSON.stringify({clima:vazio,efetivo:[],fotos:[],...base}));
  const ant=S.rdos[0];
  return {data,clima:vazio,efetivo:ant?JSON.parse(JSON.stringify(ant.efetivo||[])):[],servicos:'',ocorrencias:'',observacoes:'',fotos:[],responsavel:ant?.responsavel||S.cfg?.nomeCompleto||S.obra?.administrador||''};
}
function abrirEditor(data){
  derivar();
  S.draft=novoDraft(data);S.novasFotos=[];S.removerFotos=[];
  S.view={name:'rdoEdit',existe:!!S.rdos.find(r=>r.data===data)};render();window.scrollTo(0,0);
}
async function salvarRdo(){
  const r=S.draft;if(!r.data){toast('Informe a data');return}
  S.busy=true;render();
  try{
    const rec={id:S.obra.id+'_'+r.data,obraId:S.obra.id,data:r.data,clima:r.clima,efetivo:r.efetivo.filter(e=>e.funcao||+e.qtd).map(e=>({funcao:e.funcao||'Outros',qtd:+e.qtd||0})),servicos:r.servicos||'',ocorrencias:r.ocorrencias||'',observacoes:r.observacoes||'',fotos:r.fotos,responsavel:r.responsavel||'',atualizadoEm:new Date().toISOString()};
    await DB.put('rdos',rec);troca(S.allRdos,rec);
    if(r.data>(S.obra.ultimoRdo||'')){const o={...S.obra,ultimoRdo:r.data};await DB.put('obras',o);troca(S.obras,o)}
    for(const id of S.removerFotos)await apagarArquivo(id);
    persistir();
    const semLeg=rec.fotos.filter(f=>!(f.legenda||'').trim()).length;
    S.busy=false;S.draft=null;S.view={name:'rdo',id:rec.id};toast(semLeg?`RDO salvo — ${semLeg} foto(s) sem descrição`:'RDO salvo');render();window.scrollTo(0,0);
  }catch(e){S.busy=false;render();toast('Não foi possível salvar: '+(e&&e.name==='QuotaExceededError'?'memória do aparelho cheia':(e&&e.message)||'erro'))}
}
async function cancelarRdo(){
  for(const id of S.novasFotos||[])await apagarArquivo(id);
  S.draft=null;S.view={name:'obra',id:S.obra.id,tab:'diario'};render();
}
async function comprimir(file){
  if(!file.type.startsWith('image/')||file.type==='image/svg+xml')return file;
  try{
    const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.82));
  }catch(e){return file}
}
async function guardarArquivo(blob,nome){
  const id=uid();await DB.put('arquivos',{id,blob,tipo:blob.type||'application/octet-stream',nome:nome||''});return id;
}
async function adicionarFotos(files){
  if(!files.length)return;
  S.busy=true;render();let falhas=0;
  for(const f of files){
    try{const b=await comprimir(f);const id=await guardarArquivo(b,f.name);S.draft.fotos.push({id,legenda:''});S.novasFotos.push(id)}
    catch(e){falhas++}
  }
  S.busy=false;const primeira=S.draft.fotos.length-(files.length-falhas);render();const el=document.getElementById('leg_'+primeira);if(el){el.scrollIntoView({block:'center'});el.focus()}if(falhas)toast(`${falhas} foto(s) não salva(s). Tente novamente.`);else toast('Descreva o que cada foto mostra');
}
function textoRdo(r){
  const o=S.obra||{};const cl=r.clima||{};const ef=r.efetivo||[];const tot=ef.reduce((s,e)=>s+(+e.qtd||0),0);
  const p=(k,l)=>`${l}: ${cl[k]?.tempo||'—'}${cl[k]?.cond?' / '+cl[k].cond:''}`;
  let t=`${S.cfg?.razaoSocial?S.cfg.razaoSocial+(S.cfg.cnpj?' · CNPJ '+S.cfg.cnpj:'')+'\n':''}*RDO – ${o.nome||''}*\n${DS[dia(r.data).getDay()]}, ${fmt(r.data)}${o.inicio?` · Dia ${diff(o.inicio,r.data)+1} de obra`:''}\n\n`;
  t+=`*Clima*\n${p('manha','Manhã')}\n${p('tarde','Tarde')}\n${p('noite','Noite')}\n\n`;
  t+=`*Efetivo (${tot})*\n${ef.map(e=>`${e.qtd} ${e.funcao}`).join('\n')||'Não informado'}\n\n`;
  t+=`*Serviços executados*\n${r.servicos||'—'}\n\n*Ocorrências*\n${r.ocorrencias||'Nenhuma.'}`;
  if(r.observacoes)t+=`\n\n*Observações*\n${r.observacoes}`;
  if((r.fotos||[]).length)t+=`\n\n*Fotos*\n${r.fotos.map((f,i)=>`${i+1}. ${f.legenda||'Sem legenda'}`).join('\n')}`;
  t+=`\n\nResp. técnico: ${o.responsavel||'—'}${o.registro?' ('+o.registro+')':''}\nAdministrador: ${o.administrador||'—'}`;
  return t;
}
async function compartilharRdo(r){
  const text=textoRdo(r);
  try{
    const files=[];
    if(navigator.canShare){for(const [i,f] of (r.fotos||[]).entries()){const a=await DB.get('arquivos',f.id);if(a)files.push(new File([a.blob],`foto-${pad(i+1)}.jpg`,{type:a.tipo||'image/jpeg'}))}}
    if(files.length&&navigator.canShare({files,text})){await navigator.share({files,text,title:'RDO '+fmt(r.data)});return}
    if(navigator.share){await navigator.share({text,title:'RDO '+fmt(r.data)});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Resumo copiado. Cole no WhatsApp ou e-mail.')}catch(e){toast('Não foi possível compartilhar neste navegador')}
}

/* ---------- backup ---------- */
function blobParaDataUrl(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)})}
function baixar(blob,nome){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function exportar(comFotos){
  S.busy=true;render();
  try{
    const out={app:'diario-obra',versao:1,exportadoEm:new Date().toISOString(),comFotos,config:S.cfg,obras:S.obras,rdos:S.allRdos,locacoes:S.allLocs,projetos:S.allProjs,arquivos:[]};
    if(comFotos){const arqs=await DB.all('arquivos');for(const a of arqs)out.arquivos.push({id:a.id,tipo:a.tipo,nome:a.nome,dados:await blobParaDataUrl(a.blob)})}
    const nome=`diario-obra-backup-${hoje()}${comFotos?'':'-sem-fotos'}.json`;
    const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
    let feito=false;
    try{const f=new File([blob],nome,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[f],title:'Backup Diário de Obra'});feito=true}}catch(e){if(e&&e.name==='AbortError'){S.busy=false;render();return}}
    if(!feito)baixar(blob,nome);
    LS.set('ultimoBackup',new Date().toISOString());toast('Backup gerado');
  }catch(e){toast('Não foi possível gerar o backup')}
  S.busy=false;render();
}
async function importar(file){
  S.busy=true;render();
  try{
    const d=JSON.parse(await file.text());
    if(d.app!=='diario-obra')throw new Error('Este arquivo não é um backup do Diário de Obra.');
    let n=0;
    for(const a of d.arquivos||[]){const b=await (await fetch(a.dados)).blob();await DB.put('arquivos',{id:a.id,blob:b,tipo:a.tipo,nome:a.nome});soltarUrl(a.id)}
    for(const o of d.obras||[]){const atual=S.obras.find(x=>x.id===o.id);const rec={...o,ultimoRdo:[(atual&&atual.ultimoRdo)||'',o.ultimoRdo||''].sort().pop()};await DB.put('obras',rec);troca(S.obras,rec);n++}
    for(const r of d.rdos||[]){await DB.put('rdos',r);troca(S.allRdos,r)}
    for(const l of d.locacoes||[]){await DB.put('locacoes',l);troca(S.allLocs,l)}
    for(const p of d.projetos||[]){await DB.put('projetos',p);troca(S.allProjs,p)}
    if(d.config&&!S.cfg.razaoSocial){const c={...d.config,id:'empresa'};await DB.put('config',c);S.cfg=c}
    persistir();
    toast(`Importado: ${n} obra(s), ${(d.rdos||[]).length} RDO(s)`);
  }catch(e){toast(e.message&&e.message.startsWith('Este')?e.message:'Arquivo inválido ou corrompido')}
  S.busy=false;render();
}

/* ---------- eventos ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  switch(act){
    case 'cf-no':S.confirm=null;renderModal();break;
    case 'cf-yes':{const fn=S.confirm.fn;S.confirm=null;renderModal();await fn();break}
    case 'back':{
      const to=b.dataset.to;
      if(S.view.name==='rdoEdit'){await cancelarRdo();break}
      if(to==='home'){S.view={name:'home'};S.obra=null;LS.set('ultimaObra','')}
      else S.view={name:'obra',id:S.obra.id,tab:S.view.name==='obraForm'?'dados':'diario'};
      render();window.scrollTo(0,0);break}
    case 'backup':S.view={name:'backup'};render();break;
    case 'empresa':S.empTmp=null;S.view={name:'empresa'};render();window.scrollTo(0,0);break;
    case 'logoRm':S.empTmp={...(S.empTmp||{}),...lerEmp(),logo:''};render();break;
    case 'souEu':{const n=document.getElementById('e_nome').value.trim();if(!n){toast('Preencha primeiro seu nome completo');break}document.getElementById('e_resp').value=n;document.getElementById('e_adm').value=n;break}
    case 'exportar':exportar(b.dataset.fotos==='1');break;
    case 'novaObra':S.view={name:'obraForm'};render();break;
    case 'abrir':abrirObra(id);window.scrollTo(0,0);break;
    case 'tab':S.view.tab=b.dataset.tab;S.loc=null;S.proj=null;render();break;
    case 'rdoNovo':abrirEditor(hoje());break;
    case 'rdoVer':S.view={name:'rdo',id};render();window.scrollTo(0,0);break;
    case 'rdoEditar':abrirEditor(id);break;
    case 'rdoShare':{const r=S.allRdos.find(x=>x.id===id);if(r)compartilharRdo(r);break}
    case 'imprimir':window.print();break;
    case 'rdoExcluir':{const r=S.allRdos.find(x=>x.id===id);confirmar(`Excluir o RDO de ${fmt(r?.data)}? As fotos dele também serão apagadas.`,'Excluir',async()=>{
      try{await DB.del('rdos',id);tira(S.allRdos,id);for(const f of r?.fotos||[])await apagarArquivo(f.id);
      S.view={name:'obra',id:S.obra.id,tab:'diario'};render();toast('RDO excluído')}catch(e){toast('Não foi possível excluir')}});break}
    case 'clima':{const c=S.draft.clima[b.dataset.p];c[b.dataset.k]=b.dataset.v;if(b.dataset.v==='Sem expediente')c.cond='';else if(b.dataset.k==='tempo'&&!c.cond)c.cond='Praticável';if(b.dataset.k==='cond'&&c.tempo==='Sem expediente')c.tempo='Bom';render();break}
    case 'efAdd':S.draft.efetivo.push({funcao:b.dataset.v,qtd:1});render();break;
    case 'efRm':S.draft.efetivo.splice(+b.dataset.i,1);render();break;
    case 'fotoRm':{const f=S.draft.fotos.splice(+b.dataset.i,1)[0];if(f){if(S.novasFotos.includes(f.id))await apagarArquivo(f.id);else S.removerFotos.push(f.id)}render();break}
    case 'rdoSalvar':salvarRdo();break;
    case 'rdoCancelar':cancelarRdo();break;
    case 'locNova':S.loc={};render();break;
    case 'locEditar':S.loc={...S.locs.find(l=>l.id===id)};render();window.scrollTo(0,0);break;
    case 'locCancelar':S.loc=null;render();break;
    case 'locDevolver':{const l={...S.allLocs.find(x=>x.id===id),devolvido:true,devolvidoEm:hoje()};try{await DB.put('locacoes',l);troca(S.allLocs,l);render();toast('Marcado como devolvido')}catch(e){toast('Não foi possível atualizar')}break}
    case 'locExcluir':confirmar('Excluir esta locação?','Excluir',async()=>{try{await DB.del('locacoes',id);tira(S.allLocs,id);render();toast('Locação excluída')}catch(e){toast('Não foi possível excluir')}});break;
    case 'projNovo':S.proj={};render();break;
    case 'projCancelar':S.proj=null;render();break;
    case 'projAbrir':{const p=S.allProjs.find(x=>x.id===id);const u=p&&await urlDe(p.arquivoId);if(!u){toast('Arquivo não encontrado neste aparelho');break}const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();break}
    case 'projExcluir':confirmar('Excluir este arquivo de projeto?','Excluir',async()=>{const p=S.allProjs.find(x=>x.id===id);try{await DB.del('projetos',id);tira(S.allProjs,id);if(p?.arquivoId)await apagarArquivo(p.arquivoId);render();toast('Arquivo excluído')}catch(e){toast('Não foi possível excluir')}});break;
    case 'obraEditar':S.view={name:'obraForm',id:S.obra.id};render();break;
    case 'obraExcluir':confirmar(`Excluir a obra "${S.obra.nome}" com todo o histórico de RDOs, locações e projetos? Não dá para desfazer.`,'Excluir obra',excluirObra);break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='e_cnpj'){const m=maskCnpj(t.value);if(m!==t.value)t.value=m;const el=$('#cnpjMsg');const dg=m.replace(/\D/g,'');el.className='okmsg '+(dg.length<14?'':cnpjOk(m)?'good':'bad');el.textContent=dg.length<14?'':cnpjOk(m)?'CNPJ válido':'Confira o CNPJ: dígitos não conferem';return}
  if(!S.draft)return;
  if(t.dataset.f)S.draft[t.dataset.f]=t.value;
  else if(t.dataset.ef!==undefined)S.draft.efetivo[+t.dataset.ef][t.dataset.k]=t.value;
  else if(t.dataset.foto!==undefined){S.draft.fotos[+t.dataset.foto].legenda=t.value;const w=t.parentElement.querySelector('.legaviso');if(w)w.hidden=!!t.value.trim()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='r_data'&&S.draft){const d=t.value;if(!d)return;if(S.rdos.find(r=>r.data===d)){cancelarNovas();abrirEditor(d);toast('RDO desta data carregado')}else S.draft.data=d}
  if(t.id==='r_fotos'){adicionarFotos([...t.files]);t.value=''}
  if(t.id==='importar'&&t.files[0]){importar(t.files[0]);t.value=''}
  if(t.id==='e_logo'&&t.files[0]){carregarLogo(t.files[0]);t.value=''}
  if(t.dataset&&t.dataset.ef!==undefined&&t.dataset.k==='qtd')render();
});
async function cancelarNovas(){for(const id of S.novasFotos||[])await apagarArquivo(id)}
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target;const v=id=>(f.querySelector('#'+id)?.value||'').trim();
  if(f.id==='fEmp'){
    const rec={...S.cfg,...(S.empTmp||{}),...lerEmp(),id:'empresa'};
    try{await DB.put('config',rec);S.cfg=rec;S.empTmp=null;persistir();S.view={name:'home'};render();window.scrollTo(0,0);toast('Dados da empresa salvos')}catch(e){toast('Não foi possível salvar')}
  }
  if(f.id==='fObra'){
    const data={nome:v('o_nome'),cliente:v('o_cliente'),endereco:v('o_end'),responsavel:v('o_resp'),registro:v('o_reg'),administrador:v('o_adm'),inicio:v('o_ini'),previsao:v('o_fim'),status:v('o_status')};
    if(!data.nome){toast('Informe o nome da obra');return}
    try{
      if(S.view.id){const o={...S.obras.find(x=>x.id===S.view.id),...data};await DB.put('obras',o);troca(S.obras,o);S.view={name:'obra',id:o.id,tab:'dados'};render();toast('Obra atualizada')}
      else{const o={id:uid(),...data,criadoEm:new Date().toISOString(),ultimoRdo:''};await DB.put('obras',o);S.obras.push(o);persistir();abrirObra(o.id);toast('Obra criada')}
    }catch(e){toast('Não foi possível salvar')}
  }
  if(f.id==='fLoc'){
    const data={equipamento:v('l_eq'),fornecedor:v('l_forn'),qtd:+v('l_qtd')||1,inicio:v('l_ini'),vencimento:v('l_venc'),obs:v('l_obs'),devolvido:!!f.querySelector('#l_dev')?.checked};
    if(!data.equipamento||!data.vencimento){toast('Informe equipamento e vencimento');return}
    try{const rec={...(S.loc.id?S.allLocs.find(x=>x.id===S.loc.id):{}),...data,id:S.loc.id||uid(),obraId:S.obra.id};await DB.put('locacoes',rec);troca(S.allLocs,rec);S.loc=null;render();toast('Locação salva')}catch(e){toast('Não foi possível salvar')}
  }
  if(f.id==='fProj'){
    const file=f.querySelector('#p_arq').files[0];if(!file){toast('Escolha um arquivo');return}
    const nome=v('p_nome'),disc=v('p_disc'),rev=v('p_rev');
    S.busy=true;render();
    try{
      const arquivoId=await guardarArquivo(file,file.name);
      const rec={id:uid(),obraId:S.obra.id,nome:nome||file.name,disciplina:disc,revisao:rev,arquivoId,arquivo:file.name,tipo:file.type||'application/pdf',data:hoje()};
      await DB.put('projetos',rec);S.allProjs.push(rec);persistir();
      S.proj=null;toast('Arquivo salvo');
    }catch(e){toast(e&&e.name==='QuotaExceededError'?'Memória do aparelho cheia':'Não foi possível salvar o arquivo')}
    S.busy=false;render();
  }
});
async function excluirObra(){
  const id=S.obra.id;
  try{
    for(const r of S.allRdos.filter(x=>x.obraId===id)){for(const f of r.fotos||[])await apagarArquivo(f.id);await DB.del('rdos',r.id);tira(S.allRdos,r.id)}
    for(const l of S.allLocs.filter(x=>x.obraId===id)){await DB.del('locacoes',l.id);tira(S.allLocs,l.id)}
    for(const p of S.allProjs.filter(x=>x.obraId===id)){if(p.arquivoId)await apagarArquivo(p.arquivoId);await DB.del('projetos',p.id);tira(S.allProjs,p.id)}
    await DB.del('obras',id);tira(S.obras,id);
    S.obra=null;S.view={name:'home'};LS.set('ultimaObra','');render();toast('Obra excluída');
  }catch(e){toast('Não foi possível excluir a obra')}
}

/* ---------- início ---------- */
render();
(async()=>{
  try{
    await DB.open();
    [S.obras,S.allRdos,S.allLocs,S.allProjs]=await Promise.all(['obras','rdos','locacoes','projetos'].map(n=>DB.all(n)));
    S.cfg=(await DB.get('config','empresa'))||{id:'empresa'};
    S.ready=true;
    const u=LS.get('ultimaObra');
    if(u&&S.obras.some(o=>o.id===u))abrirObra(u);else render();
  }catch(e){
    S.erro='Este navegador não permitiu guardar dados. Abra o app pelo Chrome (Android) ou Safari (iPhone), fora da navegação anônima.';render();
  }
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
</body>
</html>
